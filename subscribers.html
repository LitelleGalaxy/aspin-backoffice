<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ASPIN Admin | Subscribers</title>

  <link
    rel="icon"
    type="image/png"
    href="favicon.png"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    .subscriber-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 25px;
    }

    .subscriber-count {
      color: #888;
      font-size: 12px;
    }

    .subscriber-search {
      width: 100%;
      box-sizing: border-box;
      padding: 13px 15px;
      margin-bottom: 18px;
      background: #080808;
      border: 1px solid #353535;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }

    .subscriber-search:focus {
      border-color: #d4af37;
    }

    .subscriber-table-wrap {
      width: 100%;
      overflow-x: auto;
      background: #101010;
      border: 1px solid #292929;
    }

    .subscriber-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    .subscriber-table th {
      padding: 14px 16px;
      text-align: left;
      background: #151515;
      border-bottom: 1px solid #292929;
      color: #d4af37;
      font-size: 10px;
      letter-spacing: .12em;
      white-space: nowrap;
    }

    .subscriber-table td {
      padding: 15px 16px;
      border-bottom: 1px solid #222;
      color: #ccc;
      font-size: 13px;
      vertical-align: middle;
    }

    .subscriber-table tr:last-child td {
      border-bottom: none;
    }

    .subscriber-table tr:hover td {
      background: #131313;
    }

    .subscriber-email {
      color: #fff;
      font-weight: 600;
      word-break: break-all;
    }

    .subscriber-phone {
      color: #aaa;
    }

    .subscriber-date {
      color: #888;
      white-space: nowrap;
    }

    .subscriber-status {
      display: inline-block;
      padding: 5px 9px;
      font-size: 10px;
      letter-spacing: .1em;
      font-weight: 700;
      border: 1px solid;
    }

    .subscriber-status.active {
      color: #d4af37;
      border-color: #6a5620;
      background: #181408;
    }

    .subscriber-status.inactive {
      color: #888;
      border-color: #3a3a3a;
      background: #151515;
    }

    .subscriber-consent {
      color: #aaa;
      font-size: 11px;
    }

    .subscriber-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .subscriber-actions button {
      border: 1px solid #3a3a3a;
      background: #171717;
      color: #eee;
      padding: 8px 11px;
      font-size: 10px;
      cursor: pointer;
      white-space: nowrap;
    }

    .subscriber-actions button:hover {
      border-color: #d4af37;
      color: #d4af37;
    }

    .subscriber-actions .delete-btn:hover {
      border-color: #a33;
      color: #ff7777;
    }

    .empty-state {
      padding: 55px;
      text-align: center;
      border: 1px solid #292929;
      background: #101010;
    }

    .empty-state p {
      color: #888;
      margin-top: 8px;
    }

    .error-message {
      display: none;
      margin-bottom: 20px;
      padding: 14px;
      border: 1px solid #6b2424;
      background: #190909;
      color: #ff8c8c;
      font-size: 13px;
    }

    .loading {
      color: #888;
      padding: 20px 0;
    }

    @media (max-width: 800px) {

      .subscriber-toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

    }

  </style>

</head>


<body>


<div class="admin-layout">


  <aside class="sidebar">

    <div class="sidebar-brand">

      <img
        src="favicon.png"
        alt="ASPIN"
        class="sidebar-logo"
      >

      <div class="sidebar-brand-text">

        <strong>ASPIN.SITE</strong>

        <span>ADMIN PORTAL</span>

      </div>

    </div>


    <nav>

      <a href="index.html">
        Dashboard
      </a>

      <a href="promotions.html">
        Promotions
      </a>

      <a href="media.html">
        Media
      </a>

      <a href="faqs.html">
        FAQs
      </a>

      <a href="payments.html">
        Payments
      </a>

      <a
        href="subscribers.html"
        class="active"
      >
        Subscribers
      </a>

      <a href="analytics.html">
        Analytics
      </a>

      <a href="settings.html">
        Settings
      </a>

    </nav>


    <button
      id="logoutBtn"
      class="logout-btn"
    >

      LOG OUT

    </button>

  </aside>


  <main class="admin-main">


    <header class="page-header">

      <div>

        <div class="eyebrow">
          ASPIN.SITE
        </div>

        <h1>
          Subscribers
        </h1>

        <p>
          Manage users who subscribed for website updates and promotions.
        </p>

      </div>

    </header>


    <div
      id="errorMessage"
      class="error-message"
    ></div>


    <div
      id="loading"
      class="loading"
    >

      Loading subscribers...

    </div>


    <section>


      <div class="subscriber-toolbar">

        <div>

          <div class="eyebrow">
            DATABASE
          </div>

          <h2>
            Subscriber List
          </h2>

        </div>


        <div
          id="subscriberCount"
          class="subscriber-count"
        ></div>

      </div>


      <input
        type="search"
        id="searchInput"
        class="subscriber-search"
        placeholder="Search by email or phone..."
      >


      <div
        id="subscriberContainer"
      ></div>


    </section>


  </main>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>


let subscribers = [];



/* =========================================
   ADMIN CHECK
========================================= */


async function requireAdmin() {

  const {

    data: { session },

    error

  } = await supabaseClient
    .auth
    .getSession();


  if (error || !session) {

    window.location.replace(
      "login.html"
    );

    return false;

  }


  return true;

}



/* =========================================
   ERROR
========================================= */


function showError(message) {

  const el =
    document.getElementById(
      "errorMessage"
    );

  el.textContent =
    message;

  el.style.display =
    "block";

}


function hideError() {

  const el =
    document.getElementById(
      "errorMessage"
    );

  el.textContent =
    "";

  el.style.display =
    "none";

}



/* =========================================
   ESCAPE HTML
========================================= */


function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/* =========================================
   FORMAT DATE
========================================= */


function formatDate(value) {

  if (!value) return "—";


  const date =
    new Date(value);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return "—";

  }


  return date.toLocaleDateString(
    undefined,
    {
      year: "numeric",
      month: "short",
      day: "numeric"
    }
  );

}



/* =========================================
   LOAD SUBSCRIBERS
========================================= */


async function loadSubscribers() {

  const allowed =
    await requireAdmin();


  if (!allowed) return;


  const loading =
    document.getElementById(
      "loading"
    );


  loading.style.display =
    "block";


  const {

    data,

    error

  } = await supabaseClient

    .from(
      "subscribers"
    )

    .select("*")

    .order(
      "created_at",
      {
        ascending: false
      }
    );


  loading.style.display =
    "none";


  if (error) {

    showError(
      "Unable to load subscribers: " +
      error.message
    );

    return;

  }


  hideError();


  subscribers =
    data || [];


  renderSubscribers();

}



/* =========================================
   RENDER SUBSCRIBERS
========================================= */


function renderSubscribers() {

  const container =
    document.getElementById(
      "subscriberContainer"
    );


  const count =
    document.getElementById(
      "subscriberCount"
    );


  const search =
    document.getElementById(
      "searchInput"
    )
    .value
    .trim()
    .toLowerCase();


  const filtered =
    subscribers.filter(
      subscriber => {

        const email =
          String(
            subscriber.email || ""
          )
          .toLowerCase();


        const phone =
          String(
            subscriber.phone || ""
          )
          .toLowerCase();


        return (
          !search ||
          email.includes(search) ||
          phone.includes(search)
        );

      }
    );


  count.textContent =
    `${filtered.length} subscriber${
      filtered.length === 1
        ? ""
        : "s"
    }`;


  if (!filtered.length) {

    container.innerHTML = `

      <div class="empty-state">

        <h2>
          ${
            search
              ? "No matching subscribers"
              : "No subscribers yet"
          }
        </h2>

        <p>
          ${
            search
              ? "Try a different search."
              : "Subscribers will appear here when they sign up."
          }
        </p>

      </div>

    `;

    return;

  }


  const rows =
    filtered.map(
      subscriber => {


        const isActive =
          subscriber.is_active !== false;


        return `

          <tr>

            <td>

              <div class="subscriber-email">

                ${escapeHtml(
                  subscriber.email ||
                  "—"
                )}

              </div>

            </td>


            <td>

              <div class="subscriber-phone">

                ${escapeHtml(
                  subscriber.phone ||
                  "—"
                )}

              </div>

            </td>


            <td>

              <span
                class="subscriber-status ${
                  isActive
                    ? "active"
                    : "inactive"
                }"
              >

                ${
                  isActive
                    ? "ACTIVE"
                    : "INACTIVE"
                }

              </span>

            </td>


            <td>

              <span class="subscriber-consent">

                ${
                  subscriber.consent
                    ? "YES"
                    : "NO"
                }

              </span>

            </td>


            <td>

              <span class="subscriber-date">

                ${formatDate(
                  subscriber.created_at
                )}

              </span>

            </td>


            <td>

              <div class="subscriber-actions">

                <button
                  type="button"
                  onclick="toggleSubscriber('${subscriber.id}')"
                >

                  ${
                    isActive
                      ? "DEACTIVATE"
                      : "ACTIVATE"
                  }

                </button>


                <button
                  type="button"
                  class="delete-btn"
                  onclick="deleteSubscriber('${subscriber.id}')"
                >

                  DELETE

                </button>

              </div>

            </td>

          </tr>

        `;

      }
    )
    .join("");


  container.innerHTML = `

    <div class="subscriber-table-wrap">

      <table class="subscriber-table">

        <thead>

          <tr>

            <th>
              EMAIL
            </th>

            <th>
              PHONE
            </th>

            <th>
              STATUS
            </th>

            <th>
              CONSENT
            </th>

            <th>
              SUBSCRIBED
            </th>

            <th>
              ACTIONS
            </th>

          </tr>

        </thead>


        <tbody>

          ${rows}

        </tbody>

      </table>

    </div>

  `;

}



/* =========================================
   TOGGLE SUBSCRIBER
========================================= */


window.toggleSubscriber =
  async function(id) {


    const subscriber =
      subscribers.find(
        item =>
          String(item.id) ===
          String(id)
      );


    if (!subscriber) return;


    const currentlyActive =
      subscriber.is_active !== false;


    const action =
      currentlyActive
        ? "deactivate"
        : "activate";


    const confirmed =
      confirm(
        `Are you sure you want to ${action} this subscriber?`
      );


    if (!confirmed) return;


    hideError();


    const {

      error

    } = await supabaseClient

      .from(
        "subscribers"
      )

      .update({

        is_active:
          !currentlyActive

      })

      .eq(
        "id",
        id
      );


    if (error) {

      showError(
        "Unable to update subscriber: " +
        error.message
      );

      return;

    }


    await loadSubscribers();

  };



/* =========================================
   DELETE SUBSCRIBER
========================================= */


window.deleteSubscriber =
  async function(id) {


    const subscriber =
      subscribers.find(
        item =>
          String(item.id) ===
          String(id)
      );


    if (!subscriber) return;


    const confirmed =
      confirm(

        `Delete "${subscriber.email}"?\n\n` +

        "This cannot be undone."

      );


    if (!confirmed) return;


    hideError();


    const {

      error

    } = await supabaseClient

      .from(
        "subscribers"
      )

      .delete()

      .eq(
        "id",
        id
      );


    if (error) {

      showError(
        "Unable to delete subscriber: " +
        error.message
      );

      return;

    }


    await loadSubscribers();

  };



/* =========================================
   SEARCH
========================================= */


document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    renderSubscribers
  );



/* =========================================
   LOGOUT
========================================= */


document
  .getElementById(
    "logoutBtn"
  )
  .addEventListener(
    "click",
    async () => {

      await supabaseClient
        .auth
        .signOut();


      window.location.replace(
        "login.html"
      );

    }
  );



/* =========================================
   INITIAL LOAD
========================================= */


loadSubscribers();


</script>

</body>

</html>
