<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ASPIN BO | Subscribers</title>

    <link
        rel="icon"
        type="image/png"
        href="favicon.png"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>
        .subscriber-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .search-box {
            padding: 11px 13px;
            background: #080808;
            border: 1px solid #333;
            color: #fff;
            min-width: 260px;
            outline: none;
        }

        .search-box:focus {
            border-color: #d4af37;
        }

        .table-wrap {
            overflow-x: auto;
            background: #101010;
            border: 1px solid #292929;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #292929;
        }

        th {
            font-size: 11px;
            letter-spacing: .1em;
            color: #aaa;
            text-transform: uppercase;
            white-space: nowrap;
        }

        td {
            font-size: 13px;
            color: #eee;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, .02);
        }

        .status {
            display: inline-block;
            font-size: 10px;
            padding: 5px 8px;
            border: 1px solid #444;
            letter-spacing: .05em;
        }

        .active-status {
            color: #79d18b;
            border-color: #315d3a;
        }

        .inactive-status {
            color: #aaa;
            border-color: #444;
        }

        .consent-yes {
            color: #79d18b;
        }

        .consent-no {
            color: #aaa;
        }

        .action-btn {
            padding: 7px 10px;
            border: 1px solid #333;
            background: #181818;
            color: #eee;
            cursor: pointer;
            transition:
                border-color .2s ease,
                color .2s ease,
                background .2s ease;
        }

        .action-btn:hover {
            border-color: #d4af37;
            color: #d4af37;
            background: #202020;
        }

        .action-btn:disabled {
            opacity: .6;
            cursor: wait;
        }

        .loading-cell,
        .empty-cell,
        .error-cell {
            text-align: center;
            padding: 35px 20px;
            color: #999;
        }

        .error-cell {
            color: #d97b7b;
        }

        @media (max-width: 700px) {

            .subscriber-toolbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .search-box {
                width: 100%;
                min-width: 0;
                box-sizing: border-box;
            }

            .table-wrap {
                width: 100%;
            }
        }

        .subscriber-filters {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .subscriber-filter {
            height: 42px;
            padding: 0 12px;
            background: #0d0d0d;
            color: #fff;
            border: 1px solid #333;
            border-radius: 0;
            font-size: 14px;
            cursor: pointer;
        }

        .subscriber-filter:focus {
            outline: none;
            border-color: #c9a227;
        }

        .subscriber-filter option {
            background: #111;
            color: #fff;
        }
    </style>
</head>


<body>

<div class="admin-layout">

    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside class="sidebar">

        <div class="sidebar-brand">

            <img
                src="favicon.png"
                alt="ASPIN"
                class="sidebar-logo"
            >

            <div class="sidebar-brand-text">

                <strong>
                    ASPIN.SITE
                </strong>

                <span>
                    BACK OFFICE
                </span>

            </div>

        </div>


        <nav class="admin-nav">

            <a href="index.html">
                Dashboard
            </a>

            <a href="promotions.html">
                Promotions
            </a>

            <a href="faqs.html">
                FAQs
            </a>

            <a href="subscribers.html">
                Subscribers
            </a>

            <a href="analytics.html">
                Analytics
            </a>

            <a href="activity.html">
                Activity History
            </a>

            <a href="settings.html">
                Settings
            </a>

        </nav>


        <button
            id="logoutBtn"
            class="logout-btn"
        >
            LOG OUT
        </button>

    </aside>


    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <main class="admin-main">

        <header class="page-header">

            <div>

                <div class="eyebrow">
                    ASPIN.SITE
                </div>

                <h1>
                    Subscribers
                </h1>

                <p>
                    Manage newsletter and promotional update subscribers.
                </p>

            </div>

        </header>


        <!-- =========================
             TOOLBAR
        ========================= -->

        <div class="subscriber-toolbar">

            <div>

                <strong id="subscriberCount">
                    0 subscribers
                </strong>

            </div>


            <div class="subscriber-filters">

                <input
                    id="searchInput"
                    class="search-box"
                    type="search"
                    placeholder="Search email or phone..."
                    autocomplete="off"
                >


                <!-- STATUS FILTER -->
                <select
                    id="statusFilter"
                    class="subscriber-filter"
                >

                    <option value="all">
                        All Status
                    </option>

                    <option value="active">
                        Active
                    </option>

                    <option value="inactive">
                        Inactive
                    </option>

                </select>


                <!-- MONTH FILTER -->
                <select
                    id="monthFilter"
                    class="subscriber-filter"
                >

                    <option value="all">
                        All Months
                    </option>

                    <option value="1">
                        January
                    </option>

                    <option value="2">
                        February
                    </option>

                    <option value="3">
                        March
                    </option>

                    <option value="4">
                        April
                    </option>

                    <option value="5">
                        May
                    </option>

                    <option value="6">
                        June
                    </option>

                    <option value="7">
                        July
                    </option>

                    <option value="8">
                        August
                    </option>

                    <option value="9">
                        September
                    </option>

                    <option value="10">
                        October
                    </option>

                    <option value="11">
                        November
                    </option>

                    <option value="12">
                        December
                    </option>

                </select>


                <!-- YEAR FILTER -->
                <select
                    id="yearFilter"
                    class="subscriber-filter"
                >

                    <option value="all">
                        All Years
                    </option>

                </select>

            </div>

        </div>


        <!-- =========================
             SUBSCRIBER TABLE
        ========================= -->

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>
                            Name
                        </th>

                        <th>
                            Email
                        </th>

                        <th>
                            Phone
                        </th>

                        <th>
                            Consent
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Date
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody id="subscriberTable">

                </tbody>

            </table>

        </div>

    </main>

</div>


<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="mobile-menu.js"></script>


<script>

let subscribers = [];


/* =========================
   ADMIN AUTH
========================= */

async function requireAdmin() {

    const {
        data: { session },
        error
    } = await supabaseClient.auth.getSession();


    if (error) {

        console.error(
            "Session error:",
            error
        );

        window.location.replace(
            "login.html"
        );

        return false;
    }


    if (!session) {

        window.location.replace(
            "login.html"
        );

        return false;
    }


    return true;
}


/* =========================
   LOAD SUBSCRIBERS
========================= */

async function loadSubscribers() {

    const isAdmin =
        await requireAdmin();


    if (!isAdmin) {
        return;
    }


    const tbody =
        document.getElementById(
            "subscriberTable"
        );


    tbody.innerHTML = `
        <tr>

            <td
                colspan="7"
                class="loading-cell"
            >
                Loading subscribers...
            </td>

        </tr>
    `;


    const {
        data,
        error
    } = await supabaseClient

        .from("subscribers")

        .select("*")

        /*
         * NEWEST SUBSCRIBER FIRST
         */
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(
            "Unable to load subscribers:",
            error
        );


        tbody.innerHTML = `
            <tr>

                <td
                    colspan="7"
                    class="error-cell"
                >

                    Unable to load subscribers:

                    ${escapeHtml(
                        error.message
                    )}

                </td>

            </tr>
        `;

        return;
    }


    subscribers =
        data || [];


    populateYearFilter();

    renderSubscribers();
}


/* =========================
   POPULATE YEAR FILTER
========================= */

function populateYearFilter() {

    const yearFilter =
        document.getElementById(
            "yearFilter"
        );


    if (!yearFilter) {
        return;
    }


    const years =
        [
            ...new Set(

                subscribers

                    .filter(
                        subscriber =>
                            subscriber.created_at
                    )

                    .map(
                        subscriber =>
                            new Date(
                                subscriber.created_at
                            ).getFullYear()
                    )

            )
        ]

        .sort(
            (a, b) =>
                b - a
        );


    yearFilter.innerHTML = `
        <option value="all">
            All Years
        </option>

        ${years
            .map(
                year =>
                    `
                    <option value="${year}">
                        ${year}
                    </option>
                    `
            )
            .join("")
        }
    `;
}


/* =========================
   RENDER SUBSCRIBERS
========================= */

function renderSubscribers() {

    const tbody =
        document.getElementById(
            "subscriberTable"
        );


    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim()
            .toLowerCase();


    const statusFilter =
        document.getElementById(
            "statusFilter"
        ).value;


    const monthFilter =
        document.getElementById(
            "monthFilter"
        ).value;


    const yearFilter =
        document.getElementById(
            "yearFilter"
        ).value;


    const filtered =
        subscribers.filter(
            subscriber => {


                /* =========================
                   SEARCH FILTER
                ========================= */

                const email =
                    String(
                        subscriber.email || ""
                    ).toLowerCase();


                const phone =
                    String(
                        subscriber.phone || ""
                    ).toLowerCase();


                const name =
                    String(
                        subscriber.name || ""
                    ).toLowerCase();


                const matchesSearch =
                    email.includes(search) ||
                    phone.includes(search) ||
                    name.includes(search);


                /* =========================
                   STATUS FILTER
                ========================= */

                const matchesStatus =
                    statusFilter === "all" ||

                    (
                        statusFilter === "active" &&
                        subscriber.is_active === true
                    ) ||

                    (
                        statusFilter === "inactive" &&
                        subscriber.is_active === false
                    );


                /* =========================
                   DATE FILTER
                ========================= */

                let matchesDate = true;


                if (subscriber.created_at) {

                    const date =
                        new Date(
                            subscriber.created_at
                        );


                    const month =
                        date.getMonth() + 1;


                    const year =
                        date.getFullYear();


                    if (
                        monthFilter !== "all" &&
                        month !== Number(
                            monthFilter
                        )
                    ) {

                        matchesDate = false;

                    }


                    if (
                        yearFilter !== "all" &&
                        year !== Number(
                            yearFilter
                        )
                    ) {

                        matchesDate = false;

                    }

                } else {

                    if (
                        monthFilter !== "all" ||
                        yearFilter !== "all"
                    ) {

                        matchesDate = false;

                    }

                }


                /* =========================
                   FINAL FILTER
                ========================= */

                return (
                    matchesSearch &&
                    matchesStatus &&
                    matchesDate
                );

            }
        );


    /* =========================
       SUBSCRIBER COUNT
    ========================= */

    document.getElementById(
        "subscriberCount"
    ).textContent =

        `${filtered.length} subscriber${
            filtered.length === 1
                ? ""
                : "s"
        }`;


    /* =========================
       CLEAR TABLE
    ========================= */

    tbody.innerHTML = "";


    /* =========================
       NO RESULTS
    ========================= */

    if (!filtered.length) {

        tbody.innerHTML = `
            <tr>

                <td
                    colspan="7"
                    class="empty-cell"
                >

                    ${
                        search ||
                        statusFilter !== "all" ||
                        monthFilter !== "all" ||
                        yearFilter !== "all"

                            ? "No subscribers match your filters."

                            : "No subscribers found."
                    }

                </td>

            </tr>
        `;

        return;
    }


    /* =========================
       RENDER ROWS
    ========================= */

    filtered.forEach(
        subscriber => {


            const tr =
                document.createElement(
                    "tr"
                );


            /* =========================
               DATE
            ========================= */

            const date =
                subscriber.created_at

                    ? new Date(
                        subscriber.created_at
                    ).toLocaleDateString(
                        undefined,
                        {
                            year: "numeric",
                            month: "short",
                            day: "numeric"
                        }
                    )

                    : "—";


            /* =========================
               CONSENT
            ========================= */

            const consentClass =
                subscriber.consent
                    ? "consent-yes"
                    : "consent-no";


            /* =========================
               STATUS
            ========================= */

            const statusClass =
                subscriber.is_active
                    ? "active-status"
                    : "inactive-status";


            const statusText =
                subscriber.is_active
                    ? "ACTIVE"
                    : "INACTIVE";


            /* =========================
               ACTION
            ========================= */

            const actionText =
                subscriber.is_active
                    ? "DEACTIVATE"
                    : "ACTIVATE";


            /* =========================
               ROW
            ========================= */

            tr.innerHTML = `

                <td>

                    ${escapeHtml(
                        subscriber.name || "—"
                    )}

                </td>


                <td>

                    ${escapeHtml(
                        subscriber.email || "—"
                    )}

                </td>


                <td>

                    ${escapeHtml(
                        subscriber.phone || "—"
                    )}

                </td>


                <td>

                    <span
                        class="${consentClass}"
                    >

                        ${
                            subscriber.consent
                                ? "YES"
                                : "NO"
                        }

                    </span>

                </td>


                <td>

                    <span
                        class="status ${statusClass}"
                    >

                        ${statusText}

                    </span>

                </td>


                <td>

                    ${escapeHtml(
                        date
                    )}

                </td>


                <td>

                    <button
                        type="button"
                        class="action-btn"
                        data-id="${escapeHtml(
                            subscriber.id
                        )}"
                        data-active="${
                            !subscriber.is_active
                        }"
                    >

                        ${actionText}

                    </button>

                </td>

            `;


            /* =========================
               ACTION BUTTON
            ========================= */

            const button =
                tr.querySelector(
                    ".action-btn"
                );


            button.addEventListener(
                "click",
                () => {

                    toggleSubscriber(
                        subscriber.id,
                        !subscriber.is_active,
                        button
                    );

                }
            );


            tbody.appendChild(
                tr
            );

        }
    );

}


/* =========================
   TOGGLE SUBSCRIBER
========================= */

async function toggleSubscriber(
    id,
    active,
    button
) {

    if (button) {

        button.disabled = true;

        button.textContent =
            "SAVING...";

    }


    const {
        error
    } = await supabaseClient

        .from("subscribers")

        .update({
            is_active: active
        })

        .eq(
            "id",
            id
        );


    if (error) {

        console.error(
            "Unable to update subscriber:",
            error
        );


        alert(
            "Unable to update subscriber: " +
            error.message
        );


        if (button) {

            button.disabled = false;

            button.textContent =
                active
                    ? "ACTIVATE"
                    : "DEACTIVATE";

        }


        return;
    }


    await loadSubscribers();

}


/* =========================
   SEARCH
========================= */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        renderSubscribers
    );


/* =========================
   STATUS FILTER
========================= */

document
    .getElementById(
        "statusFilter"
    )
    .addEventListener(
        "change",
        renderSubscribers
    );


/* =========================
   MONTH FILTER
========================= */

document
    .getElementById(
        "monthFilter"
    )
    .addEventListener(
        "change",
        renderSubscribers
    );


/* =========================
   YEAR FILTER
========================= */

document
    .getElementById(
        "yearFilter"
    )
    .addEventListener(
        "change",
        renderSubscribers
    );


/* =========================
   LOGOUT
========================= */

document
    .getElementById(
        "logoutBtn"
    )
    .addEventListener(
        "click",
        async () => {

            await supabaseClient.auth.signOut();

            window.location.replace(
                "login.html"
            );

        }
    );


/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(value) {

    return String(
        value ?? ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================
   START
========================= */

loadSubscribers();

</script>

</body>

</html>
