<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ASPIN Admin | Media</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .media-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .media-upload {
      background: #101010;
      border: 1px solid #292929;
      padding: 20px;
      margin-bottom: 25px;
    }

    .media-upload input[type="file"] {
      width: 100%;
      padding: 14px;
      border: 1px dashed #5a4a26;
      background: #080808;
      color: #ccc;
    }

    .upload-status {
      margin-top: 10px;
      color: #d4af37;
      font-size: 13px;
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .media-card {
      background: #101010;
      border: 1px solid #292929;
      overflow: hidden;
    }

    .media-preview {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #050505;
      display: block;
    }

    .media-info {
      padding: 15px;
    }

    .media-name {
      font-size: 13px;
      word-break: break-all;
      color: #eee;
      margin-bottom: 10px;
    }

    .media-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .media-actions button,
    .media-actions a {
      border: 1px solid #3a3a3a;
      background: #171717;
      color: #eee;
      padding: 8px 11px;
      font-size: 11px;
      text-decoration: none;
      cursor: pointer;
    }

    .media-actions button:hover,
    .media-actions a:hover {
      border-color: #d4af37;
      color: #d4af37;
    }

    .empty-state {
      padding: 50px;
      text-align: center;
      border: 1px solid #292929;
      background: #101010;
    }

    @media (max-width: 1100px) {
      .media-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 800px) {
      .media-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .media-toolbar {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 520px) {
      .media-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="admin-layout">

  <aside class="sidebar">

    <div class="sidebar-brand">
      <img src="favicon.png" alt="ASPIN" class="sidebar-logo">

      <div class="sidebar-brand-text">
        <strong>ASPIN.SITE</strong>
        <span>ADMIN PORTAL</span>
      </div>
    </div>

    <nav>
      <a href="index.html">Dashboard</a>
      <a href="promotions.html">Promotions</a>
      <a href="media.html" class="active">Media</a>
      <a href="faqs.html">FAQs</a>
      <a href="payments.html">Payments</a>
      <a href="subscribers.html">Subscribers</a>
      <a href="analytics.html">Analytics</a>
      <a href="settings.html">Settings</a>
    </nav>

    <button id="logoutBtn" class="logout-btn">
      LOG OUT
    </button>

  </aside>

  <main class="admin-main">

    <header class="page-header">
      <div>
        <div class="eyebrow">ASPIN.SITE</div>
        <h1>Media</h1>
        <p>Upload and manage images used across the website.</p>
      </div>
    </header>

    <section class="media-upload">

      <h2>Upload Media</h2>

      <p>
        JPG, PNG, WEBP and SVG files are supported.
      </p>

      <input
        type="file"
        id="mediaFile"
        accept="image/jpeg,image/png,image/webp,image/svg+xml"
      >

      <button
        id="uploadBtn"
        class="primary-btn"
        style="margin-top:15px;"
      >
        UPLOAD IMAGE
      </button>

      <div id="uploadStatus" class="upload-status"></div>

    </section>

    <section>

      <div class="media-toolbar">
        <div>
          <div class="eyebrow">LIBRARY</div>
          <h2>Uploaded Media</h2>
        </div>
      </div>

      <div id="mediaGrid" class="media-grid"></div>

    </section>

  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

async function requireAdmin() {

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (!session) {
    window.location.replace("login.html");
    return false;
  }

  return true;
}


async function loadMedia() {

  const allowed = await requireAdmin();

  if (!allowed) return;

  const grid =
    document.getElementById("mediaGrid");

  grid.innerHTML =
    "<p>Loading media...</p>";

  const {
    data,
    error
  } = await supabaseClient
    .storage
    .from("media")
    .list("", {
      limit: 100,
      sortBy: {
        column: "created_at",
        order: "desc"
      }
    });

  if (error) {

    grid.innerHTML =
      `<p>Unable to load media: ${escapeHtml(error.message)}</p>`;

    return;
  }

  const files = (data || [])
    .filter(file => file.name);

  if (!files.length) {

    grid.innerHTML = `
      <div class="empty-state">
        <h2>No media yet</h2>
        <p>Upload your first image above.</p>
      </div>
    `;

    return;
  }

  grid.innerHTML = "";

  files.forEach(file => {

    const path = file.name;

    const {
      data: publicData
    } = supabaseClient
      .storage
      .from("media")
      .getPublicUrl(path);

    const url = publicData.publicUrl;

    const card =
      document.createElement("article");

    card.className = "media-card";

    card.innerHTML = `
      <img
        src="${escapeHtml(url)}"
        class="media-preview"
        alt="${escapeHtml(file.name)}"
      >

      <div class="media-info">

        <div class="media-name">
          ${escapeHtml(file.name)}
        </div>

        <div class="media-actions">

          <a
            href="${escapeHtml(url)}"
            target="_blank"
          >
            VIEW
          </a>

          <button
            onclick="copyUrl('${escapeJs(url)}')"
          >
            COPY URL
          </button>

          <button
            onclick="deleteMedia('${escapeJs(path)}')"
          >
            DELETE
          </button>

        </div>

      </div>
    `;

    grid.appendChild(card);

  });

}


async function uploadMedia() {

  const file =
    document.getElementById("mediaFile").files[0];

  const status =
    document.getElementById("uploadStatus");

  if (!file) {

    status.textContent =
      "Please choose an image first.";

    return;
  }

  const allowedTypes = [
    "image/jpeg",
    "image/png",
    "image/webp",
    "image/svg+xml"
  ];

  if (!allowedTypes.includes(file.type)) {

    status.textContent =
      "Only JPG, PNG, WEBP and SVG files are allowed.";

    return;
  }

  status.textContent =
    "Uploading...";

  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();

  const filename =
    `${Date.now()}-${crypto.randomUUID()}.${extension}`;

  const path =
    `media/${filename}`;

  const {
    error
  } = await supabaseClient
    .storage
    .from("media")
    .upload(path, file, {
      cacheControl: "3600",
      upsert: false
    });

  if (error) {

    status.textContent =
      "Upload failed: " + error.message;

    return;
  }

  status.textContent =
    "Image uploaded successfully.";

  document.getElementById("mediaFile").value = "";

  loadMedia();

}


async function deleteMedia(path) {

  const confirmed =
    confirm(
      "Delete this image?\n\nThis cannot be undone."
    );

  if (!confirmed) return;

  const {
    error
  } = await supabaseClient
    .storage
    .from("media")
    .remove([path]);

  if (error) {

    alert(
      "Unable to delete image: " +
      error.message
    );

    return;
  }

  loadMedia();

}


async function copyUrl(url) {

  try {

    await navigator.clipboard.writeText(url);

    alert("Image URL copied.");

  } catch {

    prompt(
      "Copy this image URL:",
      url
    );

  }

}


function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeJs(value) {

  return String(value)
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'");

}


document
  .getElementById("uploadBtn")
  .addEventListener(
    "click",
    uploadMedia
  );


document
  .getElementById("logoutBtn")
  .addEventListener(
    "click",
    async () => {

      await supabaseClient.auth.signOut();

      window.location.replace(
        "login.html"
      );

    }
  );


loadMedia();

</script>

</body>
</html>
