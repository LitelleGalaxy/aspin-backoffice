<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ASPIN Admin | Payments</title>

  <link
    rel="icon"
    type="image/png"
    href="favicon.png"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    .payment-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 25px;
    }

    .payment-count {
      color: #888;
      font-size: 12px;
    }

    .payment-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .payment-card {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 20px;
      background: #101010;
      border: 1px solid #292929;
      padding: 18px;
    }

    .payment-image-wrap {
      width: 150px;
      height: 110px;
      background: #050505;
      border: 1px solid #292929;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .payment-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .payment-no-image {
      color: #555;
      font-size: 11px;
      text-align: center;
    }

    .payment-content {
      min-width: 0;
    }

    .payment-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
    }

    .payment-name {
      color: #fff;
      font-size: 18px;
      font-weight: 700;
    }

    .payment-description {
      color: #aaa;
      font-size: 14px;
      line-height: 1.7;
      margin-top: 9px;
      white-space: pre-wrap;
    }

    .payment-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #292929;
    }

    .payment-status {
      display: inline-block;
      padding: 5px 9px;
      font-size: 10px;
      letter-spacing: .12em;
      font-weight: 700;
      border: 1px solid;
    }

    .payment-status.published {
      color: #d4af37;
      border-color: #6a5620;
      background: #181408;
    }

    .payment-status.hidden {
      color: #888;
      border-color: #3a3a3a;
      background: #151515;
    }

    .payment-order {
      color: #777;
      font-size: 11px;
    }

    .payment-actions {
      display: flex;
      gap: 8px;
      margin-left: auto;
      flex-wrap: wrap;
    }

    .payment-actions button {
      border: 1px solid #3a3a3a;
      background: #171717;
      color: #eee;
      padding: 8px 12px;
      font-size: 11px;
      cursor: pointer;
    }

    .payment-actions button:hover {
      border-color: #d4af37;
      color: #d4af37;
    }

    .payment-actions .delete-btn:hover {
      border-color: #a33;
      color: #ff7777;
    }

    .empty-state {
      padding: 55px;
      text-align: center;
      border: 1px solid #292929;
      background: #101010;
    }

    .empty-state p {
      color: #888;
      margin-top: 8px;
    }

    .error-message {
      display: none;
      margin-bottom: 20px;
      padding: 14px;
      border: 1px solid #6b2424;
      background: #190909;
      color: #ff8c8c;
      font-size: 13px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      width: min(680px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: #101010;
      border: 1px solid #3a3a3a;
      box-shadow: 0 20px 60px rgba(0,0,0,.6);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      border-bottom: 1px solid #292929;
    }

    .modal-header h2 {
      margin: 0;
    }

    .close-btn {
      width: 34px;
      height: 34px;
      border: 1px solid #3a3a3a;
      background: #171717;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
    }

    .close-btn:hover {
      border-color: #d4af37;
      color: #d4af37;
    }

    .payment-form {
      padding: 20px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #d4af37;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 13px;
      background: #080808;
      border: 1px solid #353535;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #d4af37;
    }

    .form-group textarea {
      min-height: 130px;
      resize: vertical;
      line-height: 1.6;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .upload-box {
      border: 1px dashed #5a4a26;
      padding: 15px;
      background: #0a0a0a;
    }

    .upload-box input[type="file"] {
      width: 100%;
      color: #ccc;
    }

    .image-preview {
      width: 100%;
      max-height: 180px;
      object-fit: contain;
      background: #050505;
      margin-top: 12px;
      display: none;
      border: 1px solid #292929;
    }

    .upload-status {
      margin-top: 8px;
      color: #d4af37;
      font-size: 12px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0 20px;
    }

    .checkbox-row input {
      width: auto;
      accent-color: #d4af37;
    }

    .checkbox-row label {
      color: #ccc;
      font-size: 13px;
      cursor: pointer;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding-top: 20px;
      border-top: 1px solid #292929;
    }

    .secondary-btn {
      border: 1px solid #3a3a3a;
      background: #171717;
      color: #eee;
      padding: 11px 16px;
      font-size: 12px;
      cursor: pointer;
    }

    .secondary-btn:hover {
      border-color: #d4af37;
      color: #d4af37;
    }

    .loading {
      color: #888;
      padding: 20px 0;
    }

    @media (max-width: 800px) {

      .payment-card {
        grid-template-columns: 1fr;
      }

      .payment-image-wrap {
        width: 100%;
        height: 180px;
      }

      .payment-top {
        flex-direction: column;
      }

      .payment-actions {
        margin-left: 0;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

    }

    @media (max-width: 520px) {

      .payment-card {
        padding: 15px;
      }

      .payment-actions {
        width: 100%;
      }

      .payment-actions button {
        flex: 1;
      }

      .modal {
        max-height: 95vh;
      }

    }

  </style>

</head>


<body>

  <aside class="sidebar">

    <div class="sidebar-brand">

      <img
        src="favicon.png"

      >

      <div class="sidebar-brand-text">

        <strong>ASPIN.SITE</strong>

        <span>ADMIN PORTAL</span>

      </div>

    </div>


    <nav>

      <a href="index.html">

      </a>

      <a href="promotions.html">

      <a href="media.html">

      </a>

      <a href="faqs.html">

      </a>

      >

      </a>

      <div>

    <section>


      <div class="payment-toolbar">

          </h2>

<!-- ADD / EDIT MODAL -->

<div
  id="paymentModal"
  class="modal-overlay"
>

  <div class="modal">


    <div class="modal-header">

      <h2 id="modalTitle">
        Add Payment Method
      </h2>

      <button
        id="closeModalBtn"

        ×

      </button>

    <form
      id="paymentForm"

    >

      <input

      >


      <div class="form-group">

        <label for="name">
          PAYMENT METHOD NAME
        </label>

          id="name"

        >

          DESCRIPTION
        </label>

        ></textarea>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>


let currentPayments = [];

let editingPayment = null;



/* =========================================
   ADMIN CHECK
========================================= */


async function requireAdmin() {

  const {

    data: { session },

    error

  } = await supabaseClient
    .auth
    .getSession();


  if (error || !session) {

    window.location.replace(
      "login.html"
    );

    return false;

  }


  return true;

}



/* =========================================
   ERROR
========================================= */


function showError(message) {

  const el =
    document.getElementById(
      "errorMessage"
    );

  el.textContent =
    message;

  el.style.display =
    "block";

}


function hideError() {

  const el =
    document.getElementById(
      "errorMessage"
    );

  el.textContent =
    "";

  el.style.display =
    "none";

}



/* =========================================
   ESCAPE HTML
========================================= */


function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/* =========================================
   LOAD PAYMENTS
========================================= */


async function loadPayments() {

  const allowed =
    await requireAdmin();


  if (!allowed) return;


  const loading =
    document.getElementById(
      "loading"
    );

  const list =
    document.getElementById(
      "paymentList"
    );

  const count =
    document.getElementById(
      "paymentCount"
    );


  loading.style.display =
    "block";

  list.innerHTML =
    "";

  count.textContent =
    "";


  const {

    data,

    error

  } = await supabaseClient

    .from(
      "payment_methods"
    )

    .select("*")

    .order(
      "sort_order",
      {
        ascending: true
      }
    )

    .order(
      "created_at",
      {
        ascending: true
      }
    );


  loading.style.display =
    "none";


  if (error) {

    showError(
      "Unable to load payment methods: " +
      error.message
    );

    return;

  }


  hideError();


  currentPayments =
    data || [];


  count.textContent =
    `${currentPayments.length} payment method${
      currentPayments.length === 1
        ? ""
        : "s"
    }`;


  if (!currentPayments.length) {

    list.innerHTML = `

      <div class="empty-state">

        <h2>
          No payment methods yet
        </h2>

        <p>
          Add your first payment method to get started.
        </p>

      </div>

    `;

    return;

  }


  currentPayments.forEach(
    payment => {

      const card =
        document.createElement(
          "article"
        );


      card.className =
        "payment-card";


      const statusClass =
        payment.is_published
          ? "published"
          : "hidden";


      const statusText =
        payment.is_published
          ? "PUBLISHED"
          : "HIDDEN";


      const imageHtml =
        payment.image_url

          ? `

            <img
              src="${escapeHtml(
                payment.image_url
              )}"
              class="payment-image"
              alt="${escapeHtml(
                payment.name
              )}"
              loading="lazy"
            >

          `

          : `

            <div class="payment-no-image">
              NO IMAGE
            </div>

          `;


      card.innerHTML = `

        <div class="payment-image-wrap">

          ${imageHtml}

        </div>


        <div class="payment-content">


          <div class="payment-top">

            <div>

              <div class="payment-name">

                ${escapeHtml(
                  payment.name
                )}

              </div>


              ${
                payment.description
                  ? `
                    <div class="payment-description">
                      ${escapeHtml(
                        payment.description
                      )}
                    </div>
                  `
                  : ""
              }

            </div>

          </div>


          <div class="payment-meta">


            <span
              class="payment-status ${statusClass}"
            >

              ${statusText}

            </span>


            <span class="payment-order">

              Order:
              ${Number(
                payment.sort_order || 0
              )}

            </span>


            <div class="payment-actions">


              <button
                type="button"
                onclick="editPayment('${payment.id}')"
              >

                EDIT

              </button>


              <button
                type="button"
                onclick="togglePayment('${payment.id}')"
              >

                ${
                  payment.is_published
                    ? "HIDE"
                    : "PUBLISH"
                }

              </button>


              <button
                type="button"
                class="delete-btn"
                onclick="deletePayment('${payment.id}')"
              >

                DELETE

              </button>


            </div>


          </div>


        </div>

      `;


      list.appendChild(
        card
      );

    }
  );

}



/* =========================================
   OPEN ADD MODAL
========================================= */


function openAddModal() {

  editingPayment =
    null;


  hideError();


  document
    .getElementById(
      "paymentForm"
    )
    .reset();


  document
    .getElementById(
      "paymentId"
    )
    .value =
      "";


  document
    .getElementById(
      "sortOrder"
    )
    .value =
      0;


  document
    .getElementById(
      "isPublished"
    )
    .checked =
      true;


  document
    .getElementById(
      "imagePreview"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "imagePreview"
    )
    .src =
      "";


  document
    .getElementById(
      "uploadStatus"
    )
    .textContent =
      "";


  document
    .getElementById(
      "modalTitle"
    )
    .textContent =
      "Add Payment Method";


  document
    .getElementById(
      "paymentModal"
    )
    .classList.add(
      "active"
    );

}



/* =========================================
   EDIT PAYMENT
========================================= */


window.editPayment =
  function(id) {

    const payment =
      currentPayments.find(
        item =>
          String(item.id) ===
          String(id)
      );


    if (!payment) return;


    editingPayment =
      payment;


    hideError();


    document
      .getElementById(
        "paymentId"
      )
      .value =
        payment.id;


    document
      .getElementById(
        "name"
      )
      .value =
        payment.name || "";


    document
      .getElementById(
        "description"
      )
      .value =
        payment.description || "";


    document
      .getElementById(
        "sortOrder"
      )
      .value =
        payment.sort_order || 0;


    document
      .getElementById(
        "isPublished"
      )
      .checked =
        !!payment.is_published;


    const preview =
      document.getElementById(
        "imagePreview"
      );


    if (payment.image_url) {

      preview.src =
        payment.image_url;

      preview.style.display =
        "block";

    }

    else {

      preview.src =
        "";

      preview.style.display =
        "none";

    }


    document
      .getElementById(
        "uploadStatus"
      )
      .textContent =
        "";


    document
      .getElementById(
        "modalTitle"
      )
      .textContent =
        "Edit Payment Method";


    document
      .getElementById(
        "paymentModal"
      )
      .classList.add(
        "active"
      );

  };



/* =========================================
   CLOSE MODAL
========================================= */


function closeModal() {

  document
    .getElementById(
      "paymentModal"
    )
    .classList.remove(
      "active"
    );


  editingPayment =
    null;

}



/* =========================================
   UPLOAD PAYMENT IMAGE
========================================= */


async function uploadPaymentImage(
  file
) {

  const status =
    document.getElementById(
      "uploadStatus"
    );


  const allowedTypes = [

    "image/jpeg",

    "image/png",

    "image/webp",

    "image/svg+xml"

  ];


  if (
    !allowedTypes.includes(
      file.type
    )
  ) {

    throw new Error(
      "Only JPG, PNG, WEBP and SVG images are allowed."
    );

  }


  status.textContent =
    "Uploading image...";


  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const filename =
    `${Date.now()}-${
      Math.random()
        .toString(36)
        .slice(2)
    }.${extension}`;


  const path =
    `payments/${filename}`;


  const {

    error

  } = await supabaseClient

    .storage

    .from("media")

    .upload(
      path,
      file,
      {
        cacheControl: "3600",
        upsert: false
      }
    );


  if (error) {

    throw error;

  }


  const {

    data

  } = supabaseClient

    .storage

    .from("media")

    .getPublicUrl(
      path
    );


  status.textContent =
    "Image uploaded successfully.";


  return data.publicUrl;

}



/* =========================================
   SAVE PAYMENT
========================================= */


document
  .getElementById(
    "paymentForm"
  )
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      hideError();


      try {


        const id =
          document
            .getElementById(
              "paymentId"
            )
            .value;


        const name =
          document
            .getElementById(
              "name"
            )
            .value
            .trim();


        const description =
          document
            .getElementById(
              "description"
            )
            .value
            .trim();


        const sortOrder =
          Number(
            document
              .getElementById(
                "sortOrder"
              )
              .value
          ) || 0;


        const isPublished =
          document
            .getElementById(
              "isPublished"
            )
            .checked;


        if (!name) {

          throw new Error(
            "Please enter a payment method name."
          );

        }


        let imageUrl =
          editingPayment?.image_url ||
          null;


        const selectedFile =
          document
            .getElementById(
              "imageFile"
            )
            .files[0];


        if (selectedFile) {

          imageUrl =
            await uploadPaymentImage(
              selectedFile
            );

        }


        const paymentData = {

          name,

          description:
            description || null,

          image_url:
            imageUrl,

          sort_order:
            sortOrder,

          is_published:
            isPublished,

          updated_at:
            new Date()
              .toISOString()

        };


        let result;


        if (id) {

          result =
            await supabaseClient

              .from(
                "payment_methods"
              )

              .update(
                paymentData
              )

              .eq(
                "id",
                id
              );

        }

        else {

          result =
            await supabaseClient

              .from(
                "payment_methods"
              )

              .insert(
                paymentData
              );

        }


        if (result.error) {

          throw result.error;

        }


        closeModal();


        await loadPayments();

      }


      catch (error) {

        showError(
          "Unable to save payment method: " +
          error.message
        );

      }

    }
  );



/* =========================================
   TOGGLE PAYMENT
========================================= */


window.togglePayment =
  async function(id) {

    const payment =
      currentPayments.find(
        item =>
          String(item.id) ===
          String(id)
      );


    if (!payment) return;


    hideError();


    const {

      error

    } = await supabaseClient

      .from(
        "payment_methods"
      )

      .update({

        is_published:
          !payment.is_published,

        updated_at:
          new Date()
            .toISOString()

      })

      .eq(
        "id",
        id
      );


    if (error) {

      showError(
        "Unable to update payment method: " +
        error.message
      );

      return;

    }


    await loadPayments();

  };



/* =========================================
   DELETE PAYMENT
========================================= */


window.deletePayment =
  async function(id) {

    const payment =
      currentPayments.find(
        item =>
          String(item.id) ===
          String(id)
      );


    if (!payment) return;


    const confirmed =
      confirm(

        `Delete "${payment.name}"?\n\n` +

        "This cannot be undone."

      );


    if (!confirmed) return;


    hideError();


    const {

      error

    } = await supabaseClient

      .from(
        "payment_methods"
      )

      .delete()

      .eq(
        "id",
        id
      );


    if (error) {

      showError(
        "Unable to delete payment method: " +
        error.message
      );

      return;

    }


    /*
     * Clean up the associated
     * storage image when possible.
     */

    if (payment.image_url) {

      try {

        const marker =
          "/storage/v1/object/public/media/";


        const index =
          payment.image_url
            .indexOf(
              marker
            );


        if (index !== -1) {

          const path =
            payment.image_url
              .substring(
                index +
                marker.length
              );


          await supabaseClient

            .storage

            .from("media")

            .remove([
              path
            ]);

        }

      }

      catch (storageError) {

        console.warn(
          "Payment deleted, but image cleanup failed:",
          storageError
        );

      }

    }


    await loadPayments();

  };



/* =========================================
   IMAGE PREVIEW
========================================= */


document
  .getElementById(
    "imageFile"
  )
  .addEventListener(
    "change",
    function() {

      const file =
        this.files[0];


      if (!file) return;


      const reader =
        new FileReader();


      reader.onload =
        function(event) {

          const preview =
            document
              .getElementById(
                "imagePreview"
              );


          preview.src =
            event.target.result;


          preview.style.display =
            "block";

        };


      reader.readAsDataURL(
        file
      );

    }
  );



/* =========================================
   BUTTONS
========================================= */


document
  .getElementById(
    "addPaymentBtn"
  )
  .addEventListener(
    "click",
    openAddModal
  );


document
  .getElementById(
    "closeModalBtn"
  )
  .addEventListener(
    "click",
    closeModal
  );


document
  .getElementById(
    "cancelBtn"
  )
  .addEventListener(
    "click",
    closeModal
  );


document
  .getElementById(
    "paymentModal"
  )
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target ===
        this
      ) {

        closeModal();

      }

    }
  );



/* =========================================
   LOGOUT
========================================= */


document
  .getElementById(
    "logoutBtn"
  )
  .addEventListener(
    "click",
    async () => {

      await supabaseClient
        .auth
        .signOut();


      window.location.replace(
        "login.html"
      );

    }
  );



/* =========================================
   INITIAL LOAD
========================================= */


loadPayments();


</script>
