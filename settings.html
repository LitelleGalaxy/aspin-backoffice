<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ASPIN Admin | Settings</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .settings-panel {
      background: #101010;
      border: 1px solid #292929;
      padding: 22px;
    }

    .settings-panel.full {
      grid-column: 1 / -1;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      letter-spacing: .1em;
      color: #aaa;
      margin-bottom: 7px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      background: #080808;
      border: 1px solid #333;
      color: #fff;
    }

    .form-group textarea {
      min-height: 130px;
      resize: vertical;
    }

    .save-status {
      margin-top: 12px;
      color: #d4af37;
      font-size: 13px;
    }

    .account-box {
      background: #080808;
      border: 1px solid #292929;
      padding: 15px;
      margin-top: 10px;
    }

    .account-box span {
      display: block;
      color: #888;
      font-size: 11px;
      margin-bottom: 5px;
    }

    .account-box strong {
      word-break: break-word;
    }

    @media (max-width: 800px) {
      .settings-grid {
        grid-template-columns: 1fr;
      }

      .settings-panel.full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

<div class="admin-layout">

  <aside class="sidebar">

    <div class="sidebar-brand">
      <img src="favicon.png" alt="ASPIN" class="sidebar-logo">

      <div class="sidebar-brand-text">
        <strong>ASPIN.SITE</strong>
        <span>ADMIN PORTAL</span>
      </div>
    </div>

    <nav>
      <a href="index.html">Dashboard</a>
      <a href="promotions.html">Promotions</a>
      <a href="media.html">Media</a>
      <a href="faqs.html">FAQs</a>
      <a href="payments.html">Payments</a>
      <a href="subscribers.html">Subscribers</a>
      <a href="analytics.html">Analytics</a>
      <a href="settings.html" class="active">Settings</a>
    </nav>

    <button id="logoutBtn" class="logout-btn">
      LOG OUT
    </button>

  </aside>

  <main class="admin-main">

    <header class="page-header">

      <div>
        <div class="eyebrow">ASPIN.SITE</div>
        <h1>Settings</h1>
        <p>Manage general website configuration.</p>
      </div>

    </header>


    <div class="settings-grid">


      <section class="settings-panel">

        <div class="eyebrow">
          GENERAL
        </div>

        <h2>
          Website Information
        </h2>

        <form id="generalForm">

          <div class="form-group">

            <label>
              SITE NAME
            </label>

            <input
              id="site_name"
              type="text"
              placeholder="ASPIN.SITE"
            >

          </div>

          <div class="form-group">

            <label>
              SITE DESCRIPTION
            </label>

            <textarea
              id="site_description"
              placeholder="Website description..."
            ></textarea>

          </div>

          <div class="form-group">

            <label>
              CONTACT EMAIL
            </label>

            <input
              id="contact_email"
              type="email"
              placeholder="support@example.com"
            >

          </div>

          <div class="form-group">

            <label>
              CONTACT PHONE
            </label>

            <input
              id="contact_phone"
              type="text"
              placeholder="+63..."
            >

          </div>

          <button
            type="submit"
            class="primary-btn"
          >
            SAVE SETTINGS
          </button>

          <div
            id="generalStatus"
            class="save-status"
          ></div>

        </form>

      </section>


      <section class="settings-panel">

        <div class="eyebrow">
          SOCIAL
        </div>

        <h2>
          Social Links
        </h2>

        <form id="socialForm">

          <div class="form-group">

            <label>
              FACEBOOK
            </label>

            <input
              id="facebook_url"
              type="url"
              placeholder="https://facebook.com/..."
            >

          </div>

          <div class="form-group">

            <label>
              INSTAGRAM
            </label>

            <input
              id="instagram_url"
              type="url"
              placeholder="https://instagram.com/..."
            >

          </div>

          <div class="form-group">

            <label>
              TELEGRAM
            </label>

            <input
              id="telegram_url"
              type="url"
              placeholder="https://t.me/..."
            >

          </div>

          <button
            type="submit"
            class="primary-btn"
          >
            SAVE SOCIAL LINKS
          </button>

          <div
            id="socialStatus"
            class="save-status"
          ></div>

        </form>

      </section>


      <section class="settings-panel full">

        <div class="eyebrow">
          ACCOUNT
        </div>

        <h2>
          Current Admin Account
        </h2>

        <div class="account-box">

          <span>
            SIGNED-IN EMAIL
          </span>

          <strong id="adminEmail">
            Loading...
          </strong>

        </div>

      </section>


    </div>

  </main>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

async function requireAdmin() {

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (!session) {

    window.location.replace(
      "login.html"
    );

    return null;
  }

  return session;
}


async function loadSettings() {

  const session =
    await requireAdmin();

  if (!session) return;

  document.getElementById(
    "adminEmail"
  ).textContent =
    session.user.email || "—";


  const {
    data,
    error
  } = await supabaseClient
    .from("site_settings")
    .select("*");

  if (error) {

    console.error(
      "Unable to load settings:",
      error
    );

    return;
  }


  const settings = {};

  (data || []).forEach(
    item => {

      settings[item.key] =
        item.value;

    }
  );


  document.getElementById(
    "site_name"
  ).value =
    settings.site_name || "";


  document.getElementById(
    "site_description"
  ).value =
    settings.site_description || "";


  document.getElementById(
    "contact_email"
  ).value =
    settings.contact_email || "";


  document.getElementById(
    "contact_phone"
  ).value =
    settings.contact_phone || "";


  document.getElementById(
    "facebook_url"
  ).value =
    settings.facebook_url || "";


  document.getElementById(
    "instagram_url"
  ).value =
    settings.instagram_url || "";


  document.getElementById(
    "telegram_url"
  ).value =
    settings.telegram_url || "";

}


async function saveSetting(
  key,
  value
) {

  const {
    error
  } = await supabaseClient
    .from("site_settings")
    .upsert({
      key,
      value,
      updated_at:
        new Date().toISOString()
    }, {
      onConflict: "key"
    });

  return error;

}


document
  .getElementById("generalForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      const status =
        document.getElementById(
          "generalStatus"
        );

      status.textContent =
        "Saving...";


      const settings = {

        site_name:
          document.getElementById(
            "site_name"
          ).value.trim(),

        site_description:
          document.getElementById(
            "site_description"
          ).value.trim(),

        contact_email:
          document.getElementById(
            "contact_email"
          ).value.trim(),

        contact_phone:
          document.getElementById(
            "contact_phone"
          ).value.trim()

      };


      for (
        const [key, value]
        of Object.entries(settings)
      ) {

        const error =
          await saveSetting(
            key,
            value
          );

        if (error) {

          status.textContent =
            "Unable to save: " +
            error.message;

          return;
        }

      }


      status.textContent =
        "Settings saved.";

    }
  );


document
  .getElementById("socialForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      const status =
        document.getElementById(
          "socialStatus"
        );

      status.textContent =
        "Saving...";


      const settings = {

        facebook_url:
          document.getElementById(
            "facebook_url"
          ).value.trim(),

        instagram_url:
          document.getElementById(
            "instagram_url"
          ).value.trim(),

        telegram_url:
          document.getElementById(
            "telegram_url"
          ).value.trim()

      };


      for (
        const [key, value]
        of Object.entries(settings)
      ) {

        const error =
          await saveSetting(
            key,
            value
          );

        if (error) {

          status.textContent =
            "Unable to save: " +
            error.message;

          return;
        }

      }


      status.textContent =
        "Social links saved.";

    }
  );


document
  .getElementById("logoutBtn")
  .addEventListener(
    "click",
    async () => {

      await supabaseClient.auth.signOut();

      window.location.replace(
        "login.html"
      );

    }
  );


loadSettings();

</script>

</body>
</html>
