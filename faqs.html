<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ASPIN Admin | FAQs</title>

  <link
    rel="icon"
    type="image/png"
    href="favicon.png"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    .faq-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 25px;
    }

    .faq-count {
      color: #888;
      font-size: 12px;
    }

    .faq-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .faq-card {
      background: #101010;
      border: 1px solid #292929;
      padding: 20px;
    }

    .faq-card:hover {
      border-color: #4a3a1c;
    }

    .faq-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
    }

    .faq-question {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      line-height: 1.4;
    }

    .faq-answer {
      margin-top: 12px;
      color: #aaa;
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .faq-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
      padding-top: 15px;
      border-top: 1px solid #292929;
    }

    .faq-status {
      display: inline-block;
      padding: 5px 9px;
      font-size: 10px;
      letter-spacing: .12em;
      font-weight: 700;
      border: 1px solid;
    }

    .faq-status.published {
      color: #d4af37;
      border-color: #6a5620;
      background: #181408;
    }

    .faq-status.hidden {
      color: #888;
      border-color: #3a3a3a;
      background: #151515;
    }

    .faq-order {
      color: #777;
      font-size: 11px;
    }

    .faq-actions {
      display: flex;
      gap: 8px;
      margin-left: auto;
      flex-wrap: wrap;
    }

    .faq-actions button {
      border: 1px solid #3a3a3a;
      background: #171717;
      color: #eee;
      padding: 8px 12px;
      font-size: 11px;
      cursor: pointer;
    }

    .faq-actions button:hover {
      border-color: #d4af37;
      color: #d4af37;
    }

    .faq-actions .delete-btn:hover {
      border-color: #a33;
      color: #ff7777;
    }

    .empty-state {
      padding: 55px;
      text-align: center;
      border: 1px solid #292929;
      background: #101010;
    }

    .empty-state p {
      color: #888;
      margin-top: 8px;
    }

    .error-message {
      display: none;
      margin-bottom: 20px;
      padding: 14px;
      border: 1px solid #6b2424;
      background: #190909;
      color: #ff8c8c;
      font-size: 13px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      width: min(680px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: #101010;
      border: 1px solid #3a3a3a;
      box-shadow: 0 20px 60px rgba(0,0,0,.6);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      border-bottom: 1px solid #292929;
    }

    .modal-header h2 {
      margin: 0;
    }

    .close-btn {
      width: 34px;
      height: 34px;
      border: 1px solid #3a3a3a;
      background: #171717;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
    }

    .close-btn:hover {
      border-color: #d4af37;
      color: #d4af37;
    }

    .faq-form {
      padding: 20px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #d4af37;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 13px;
      background: #080808;
      border: 1px solid #353535;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #d4af37;
    }

    .form-group textarea {
      min-height: 150px;
      resize: vertical;
      line-height: 1.6;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0 20px;
    }

    .checkbox-row input {
      width: auto;
      accent-color: #d4af37;
    }

    .checkbox-row label {
      color: #ccc;
      font-size: 13px;
      cursor: pointer;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding-top: 20px;
      border-top: 1px solid #292929;
    }

    .secondary-btn {
      border: 1px solid #3a3a3a;
      background: #171717;
      color: #eee;
      padding: 11px 16px;
      font-size: 12px;
      cursor: pointer;
    }

    .secondary-btn:hover {
      border-color: #d4af37;
      color: #d4af37;
    }

    .loading {
      color: #888;
      padding: 20px 0;
    }

    @media (max-width: 800px) {

      .faq-toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .faq-top {
        flex-direction: column;
      }

      .faq-actions {
        margin-left: 0;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

    }

    @media (max-width: 520px) {

      .faq-card {
        padding: 16px;
      }

      .faq-actions {
        width: 100%;
      }

      .faq-actions button {
        flex: 1;
      }

      .modal {
        max-height: 95vh;
      }

    }

  </style>

</head>


<body>


<div class="admin-layout">


  <aside class="sidebar">

    <div class="sidebar-brand">

      <img
        src="favicon.png"
        alt="ASPIN"
        class="sidebar-logo"
      >

      <div class="sidebar-brand-text">

        <strong>ASPIN.SITE</strong>

        <span>ADMIN PORTAL</span>

      </div>

    </div>


    <nav>

      <a href="index.html">
        Dashboard
      </a>

      <a href="promotions.html">
        Promotions
      </a>

      <a href="media.html">
        Media
      </a>

      <a
        href="faqs.html"
        class="active"
      >
        FAQs
      </a>

      <a href="payments.html">
        Payments
      </a>

      <a href="subscribers.html">
        Subscribers
      </a>

      <a href="analytics.html">
        Analytics
      </a>

      <a href="settings.html">
        Settings
      </a>

    </nav>


    <button
      id="logoutBtn"
      class="logout-btn"
    >

      LOG OUT

    </button>

  </aside>


  <main class="admin-main">


    <header class="page-header">

      <div>

        <div class="eyebrow">
          ASPIN.SITE
        </div>

        <h1>
          FAQs
        </h1>

        <p>
          Manage frequently asked questions displayed on the website.
        </p>

      </div>


      <button
        id="addFaqBtn"
        class="primary-btn"
      >

        + ADD FAQ

      </button>

    </header>


    <div
      id="errorMessage"
      class="error-message"
    ></div>


    <div
      id="loading"
      class="loading"
    >

      Loading FAQs...

    </div>


    <section>

      <div class="faq-toolbar">

        <div>

          <div class="eyebrow">
            CONTENT
          </div>

          <h2>
            FAQ Library
          </h2>

        </div>


        <div
          id="faqCount"
          class="faq-count"
        ></div>

      </div>


      <div
        id="faqList"
        class="faq-list"
      ></div>

    </section>


  </main>

</div>


<!-- MODAL -->

<div
  id="faqModal"
  class="modal-overlay"
>

  <div class="modal">


    <div class="modal-header">

      <h2 id="modalTitle">
        Add FAQ
      </h2>

      <button
        id="closeModalBtn"
        class="close-btn"
        type="button"
      >

        ×

      </button>

    </div>


    <form
      id="faqForm"
      class="faq-form"
    >

      <input
        type="hidden"
        id="faqId"
      >


      <div class="form-group">

        <label for="question">
          QUESTION
        </label>

        <input
          id="question"
          type="text"
          placeholder="How do I register?"
          required
        >

      </div>


      <div class="form-group">

        <label for="answer">
          ANSWER
        </label>

        <textarea
          id="answer"
          placeholder="Enter the answer..."
          required
        ></textarea>

      </div>


      <div class="form-row">

        <div class="form-group">

          <label for="sortOrder">
            DISPLAY ORDER
          </label>

          <input
            id="sortOrder"
            type="number"
            min="0"
            value="0"
          >

        </div>

      </div>


      <div class="checkbox-row">

        <input
          id="isPublished"
          type="checkbox"
          checked
        >

        <label for="isPublished">
          Publish this FAQ on the website
        </label>

      </div>


      <div class="modal-actions">

        <button
          id="cancelBtn"
          type="button"
          class="secondary-btn"
        >

          CANCEL

        </button>


        <button
          type="submit"
          class="primary-btn"
        >

          SAVE FAQ

        </button>

      </div>


    </form>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>


let currentFaqs = [];



/* =========================================
   ADMIN CHECK
========================================= */


async function requireAdmin() {

  const {

    data: { session },

    error

  } = await supabaseClient
    .auth
    .getSession();


  if (error || !session) {

    window.location.replace(
      "login.html"
    );

    return false;

  }


  return true;

}



/* =========================================
   ERROR
========================================= */


function showError(message) {

  const el =
    document.getElementById(
      "errorMessage"
    );

  el.textContent = message;

  el.style.display = "block";

}


function hideError() {

  const el =
    document.getElementById(
      "errorMessage"
    );

  el.textContent = "";

  el.style.display = "none";

}



/* =========================================
   ESCAPE HTML
========================================= */


function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/* =========================================
   LOAD FAQS
========================================= */


async function loadFaqs() {

  const allowed =
    await requireAdmin();


  if (!allowed) return;


  const loading =
    document.getElementById(
      "loading"
    );

  const list =
    document.getElementById(
      "faqList"
    );

  const count =
    document.getElementById(
      "faqCount"
    );


  loading.style.display =
    "block";

  list.innerHTML = "";

  count.textContent = "";


  const {

    data,

    error

  } = await supabaseClient

    .from("faqs")

    .select("*")

    .order(
      "sort_order",
      {
        ascending: true
      }
    )

    .order(
      "created_at",
      {
        ascending: true
      }
    );


  loading.style.display =
    "none";


  if (error) {

    showError(
      "Unable to load FAQs: " +
      error.message
    );

    return;

  }


  hideError();


  currentFaqs =
    data || [];


  count.textContent =
    `${currentFaqs.length} FAQ${
      currentFaqs.length === 1
        ? ""
        : "s"
    }`;


  if (!currentFaqs.length) {

    list.innerHTML = `

      <div class="empty-state">

        <h2>
          No FAQs yet
        </h2>

        <p>
          Add your first FAQ to get started.
        </p>

      </div>

    `;

    return;

  }


  currentFaqs.forEach(
    faq => {

      const card =
        document.createElement(
          "article"
        );


      card.className =
        "faq-card";


      const statusClass =
        faq.is_published
          ? "published"
          : "hidden";


      const statusText =
        faq.is_published
          ? "PUBLISHED"
          : "HIDDEN";


      card.innerHTML = `

        <div class="faq-top">

          <div>

            <div class="faq-question">

              ${escapeHtml(
                faq.question
              )}

            </div>


            <div class="faq-answer">

              ${escapeHtml(
                faq.answer
              )}

            </div>

          </div>

        </div>


        <div class="faq-meta">

          <span
            class="faq-status ${statusClass}"
          >

            ${statusText}

          </span>


          <span class="faq-order">

            Order:
            ${Number(
              faq.sort_order || 0
            )}

          </span>


          <div class="faq-actions">

            <button
              type="button"
              onclick="editFaq('${faq.id}')"
            >

              EDIT

            </button>


            <button
              type="button"
              onclick="toggleFaq('${faq.id}')"
            >

              ${
                faq.is_published
                  ? "HIDE"
                  : "PUBLISH"
              }

            </button>


            <button
              type="button"
              class="delete-btn"
              onclick="deleteFaq('${faq.id}')"
            >

              DELETE

            </button>

          </div>

        </div>

      `;


      list.appendChild(
        card
      );

    }
  );

}



/* =========================================
   OPEN ADD MODAL
========================================= */


function openAddModal() {

  hideError();


  document
    .getElementById("faqForm")
    .reset();


  document
    .getElementById("faqId")
    .value = "";


  document
    .getElementById("sortOrder")
    .value = 0;


  document
    .getElementById("isPublished")
    .checked = true;


  document
    .getElementById("modalTitle")
    .textContent =
      "Add FAQ";


  document
    .getElementById("faqModal")
    .classList.add(
      "active"
    );

}



/* =========================================
   EDIT FAQ
========================================= */


window.editFaq =
  function(id) {

    const faq =
      currentFaqs.find(
        item =>
          String(item.id) ===
          String(id)
      );


    if (!faq) return;


    hideError();


    document
      .getElementById("faqId")
      .value =
        faq.id;


    document
      .getElementById("question")
      .value =
        faq.question || "";


    document
      .getElementById("answer")
      .value =
        faq.answer || "";


    document
      .getElementById("sortOrder")
      .value =
        faq.sort_order || 0;


    document
      .getElementById("isPublished")
      .checked =
        !!faq.is_published;


    document
      .getElementById("modalTitle")
      .textContent =
        "Edit FAQ";


    document
      .getElementById("faqModal")
      .classList.add(
        "active"
      );

  };



/* =========================================
   CLOSE MODAL
========================================= */


function closeModal() {

  document
    .getElementById("faqModal")
    .classList.remove(
      "active"
    );

}



/* =========================================
   SAVE FAQ
========================================= */


document
  .getElementById("faqForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      hideError();


      const id =
        document
          .getElementById("faqId")
          .value;


      const question =
        document
          .getElementById("question")
          .value
          .trim();


      const answer =
        document
          .getElementById("answer")
          .value
          .trim();


      const sortOrder =
        Number(
          document
            .getElementById("sortOrder")
            .value
        ) || 0;


      const isPublished =
        document
          .getElementById("isPublished")
          .checked;


      if (!question) {

        showError(
          "Please enter a question."
        );

        return;

      }


      if (!answer) {

        showError(
          "Please enter an answer."
        );

        return;

      }


      const faqData = {

        question,

        answer,

        sort_order:
          sortOrder,

        is_published:
          isPublished,

        updated_at:
          new Date()
            .toISOString()

      };


      let result;


      if (id) {

        result =
          await supabaseClient

            .from("faqs")

            .update(
              faqData
            )

            .eq(
              "id",
              id
            );

      }

      else {

        result =
          await supabaseClient

            .from("faqs")

            .insert(
              faqData
            );

      }


      if (result.error) {

        showError(
          "Unable to save FAQ: " +
          result.error.message
        );

        return;

      }


      closeModal();


      await loadFaqs();

    }
  );



/* =========================================
   TOGGLE PUBLISHED
========================================= */


window.toggleFaq =
  async function(id) {

    const faq =
      currentFaqs.find(
        item =>
          String(item.id) ===
          String(id)
      );


    if (!faq) return;


    hideError();


    const {

      error

    } = await supabaseClient

      .from("faqs")

      .update({

        is_published:
          !faq.is_published,

        updated_at:
          new Date()
            .toISOString()

      })

      .eq(
        "id",
        id
      );


    if (error) {

      showError(
        "Unable to update FAQ: " +
        error.message
      );

      return;

    }


    await loadFaqs();

  };



/* =========================================
   DELETE FAQ
========================================= */


window.deleteFaq =
  async function(id) {

    const faq =
      currentFaqs.find(
        item =>
          String(item.id) ===
          String(id)
      );


    if (!faq) return;


    const confirmed =
      confirm(

        `Delete "${faq.question}"?\n\n` +

        "This cannot be undone."

      );


    if (!confirmed) return;


    hideError();


    const {

      error

    } = await supabaseClient

      .from("faqs")

      .delete()

      .eq(
        "id",
        id
      );


    if (error) {

      showError(
        "Unable to delete FAQ: " +
        error.message
      );

      return;

    }


    await loadFaqs();

  };



/* =========================================
   BUTTONS
========================================= */


document
  .getElementById("addFaqBtn")
  .addEventListener(
    "click",
    openAddModal
  );


document
  .getElementById("closeModalBtn")
  .addEventListener(
    "click",
    closeModal
  );


document
  .getElementById("cancelBtn")
  .addEventListener(
    "click",
    closeModal
  );


document
  .getElementById("faqModal")
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target ===
        this
      ) {

        closeModal();

      }

    }
  );


/* =========================================
   LOGOUT
========================================= */


document
  .getElementById("logoutBtn")
  .addEventListener(
    "click",
    async () => {

      await supabaseClient
        .auth
        .signOut();


      window.location.replace(
        "login.html"
      );

    }
  );


/* =========================================
   INITIAL LOAD
========================================= */


loadFaqs();

</script>

</body>

</html>
